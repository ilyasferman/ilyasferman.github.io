name: Fix CV location

on:
  push:
    paths:
      - '.github/workflows/fix-cv-location.yml'

permissions:
  contents: write

jobs:
  fix-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CV placement
        run: python3 .github/scripts/fix_cv_location.py
      - name: Commit changes
        run: |
          git config user.name "ilyasferman"
          git config user.email "iferman92@gmail.com"
          git rm .github/workflows/fix-cv-location.yml .github/scripts/fix_cv_location.py
          git add index.html assets/site-final.css
          git commit -m "Keep CV only in top menu and open modal viewer"
          git push
