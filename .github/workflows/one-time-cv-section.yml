name: One-time CV section update

on:
  push:
    paths:
      - '.github/workflows/one-time-cv-section.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build CV preview
        run: mkdir -p assets && pdftoppm -jpeg -f 1 -singlefile -r 150 cv/ilyas-ferman-akademik-cv.pdf assets/cv-preview
      - name: Patch site
        run: python3 .github/cv_patch.py
      - name: Commit site update
        run: |
          git config user.name "ilyasferman"
          git config user.email "iferman92@gmail.com"
          git rm .github/workflows/one-time-cv-section.yml .github/cv_patch.py
          git add index.html assets/site-final.css assets/cv-preview.jpg
          git commit -m "Add visible academic CV section with preview"
          git push
